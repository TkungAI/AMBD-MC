site_name: TestRepo Docs
site_description: "TestRepo — 模型与工具文档"
site_author: autoMBD
repo_name: autoMBD/TestRepo
repo_url: https://github.com/autoMBD/TestRepo
nav:
  - Home: home.md
  - Quick Start: getting-started.md
  - Architecture: architecture.md
  - Tutorials:
      - Quick Tutorial: tutorials/tutorial-quick.md
      - Advanced: tutorials/tutorial-advanced.md
  - Examples: examples/example.md
  - Changelog: changelog.md
  - FAQ: faq.md
  - doc-license: doc-license.md
  - Contributing: doc-contributing.md

theme:
  name: material
  palette:
    primary: 'indigo'
    accent: 'indigo'
  features:
    - navigation.instant
    - content.code.copy

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed
plugins:
  - search
